spring.application.name=BT09
# H2 in-memory quick start
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# GraphQL
spring.graphql.graphiql.enabled=true 


# H2 console (optional): http://localhost:8080/h2-console
spring.h2.console.enabled=true


# (Optional) JSP view resolver if you use JSP
spring.mvc.view.prefix=/META-INF/resources/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp